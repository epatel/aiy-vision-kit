# One DKMS package for all Vision Bonnet modules (Google shipped four:
# aiy-vision-dkms, aiy-dkms, leds-ktd202x-dkms, pwm-soft-dkms).
# install.sh copies port/drivers/ to /usr/src/aiy-vision-kit-<version>/.
PACKAGE_NAME="aiy-vision-kit"
PACKAGE_VERSION="#MODULE_VERSION#"

MAKE[0]="make -C vision KVERSION=${kernelver} && make -C leds KVERSION=${kernelver} && make -C pwm KVERSION=${kernelver} && make -C aiy KVER=${kernelver}"
CLEAN="make -C vision KVERSION=${kernelver} clean; make -C leds KVERSION=${kernelver} clean; make -C pwm KVERSION=${kernelver} clean; make -C aiy KVER=${kernelver} clean"

BUILT_MODULE_NAME[0]="aiy-vision"
BUILT_MODULE_LOCATION[0]="vision/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="leds-ktd202x"
BUILT_MODULE_LOCATION[1]="leds/"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="pwm-soft"
BUILT_MODULE_LOCATION[2]="pwm/"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="aiy-io-i2c"
BUILT_MODULE_LOCATION[3]="aiy/aiy/mfd/"
DEST_MODULE_LOCATION[3]="/updates/dkms"

BUILT_MODULE_NAME[4]="gpio-aiy-io"
BUILT_MODULE_LOCATION[4]="aiy/aiy/gpio/"
DEST_MODULE_LOCATION[4]="/updates/dkms"

BUILT_MODULE_NAME[5]="pwm-aiy-io"
BUILT_MODULE_LOCATION[5]="aiy/aiy/pwm/"
DEST_MODULE_LOCATION[5]="/updates/dkms"

BUILT_MODULE_NAME[6]="aiy-adc"
BUILT_MODULE_LOCATION[6]="aiy/aiy/iio/adc/"
DEST_MODULE_LOCATION[6]="/updates/dkms"

AUTOINSTALL="yes"
