<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Kit Port</title>
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --accent: #2f6f4e; --accent-soft: #e2efe7; --warn: #9a5b00; --warn-soft: #fbefd9;
  --gate: #8a2b2b; --gate-soft: #f6e3e3; --code: #efede6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #1f1f1c; --text: #ebe9e2; --muted: #9b998f; --line: #34332e;
    --accent: #7cc49c; --accent-soft: #1f3329; --warn: #e4b45f; --warn-soft: #3a2e17;
    --gate: #e48a8a; --gate-soft: #3a2020; --code: #2a2925;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #1f1f1c; --text: #ebe9e2; --muted: #9b998f; --line: #34332e;
  --accent: #7cc49c; --accent-soft: #1f3329; --warn: #e4b45f; --warn-soft: #3a2e17;
  --gate: #e48a8a; --gate-soft: #3a2020; --code: #2a2925;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
a { color: var(--accent); }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--muted); }
.row .tools { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
section > header { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
section > header h2 { font-size: 16px; margin: 0; flex: 1; }
section > header .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
section > header .chev { color: var(--muted); transition: transform .2s; }
section.collapsed > header .chev { transform: rotate(-90deg); }
section.collapsed > .body { display: none; }
.body { padding: 0 16px 10px; }
.intro { color: var(--muted); font-size: 13.5px; margin: -4px 0 8px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
li input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
li .links { display: block; font-size: 12.5px; margin-top: 2px; }
li .links a { margin-right: 10px; }
li.done .t > span:first-child { color: var(--muted); text-decoration: line-through; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.tag.gate { background: var(--gate-soft); color: var(--gate); }
.tag.risk { background: var(--warn-soft); color: var(--warn); }
.hide-done li.done { display: none; }
footer { color: var(--muted); font-size: 12.5px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>AIY Vision Kit v1 → Raspberry Pi OS Bookworm</h1>
  <p class="sub">Pi Zero W · Vision Bonnet (MA2450) · Pi Camera v2. Checkmarks are saved in this browser. See <a href="README.md">README</a> and <a href="CLAUDE.md">CLAUDE.md</a>.</p>

  <div class="bar">
    <div class="meter"><i id="meter"></i></div>
    <div class="row">
      <span id="total">0 / 0 done</span>
      <span class="tools">
        <button id="hideDone" aria-pressed="false">Hide done</button>
        <button id="expand">Expand all</button>
        <button id="collapse">Collapse all</button>
        <button id="copy">Copy as Markdown</button>
        <button id="reset">Reset</button>
      </span>
    </div>
  </div>

  <div id="phases"></div>

  <footer>Links starting with <code>docs/</code> point to the local snapshots, so open this file from the project folder. Created 2026-10-20.</footer>
</main>

<script>
const D = 'docs/aiyprojects-raspbian/';
const R = 'docs/reference/';
const PHASES = [
  { id: 'p0', title: 'Phase 0 · Baseline and rescue the binaries',
    intro: 'Google’s apt repo is gone (404). The Myriad firmware and models survive only in the old image, so this phase comes first.',
    items: [
      ['p0-1', 'Download <code>aiyprojects-2021-04-02.img.xz</code> (1.1 GB) and check its sha256', [['Releases', 'https://github.com/google/aiyprojects-raspbian/releases/tag/v20210402']]],
      ['p0-2', 'Flash it to a spare SD card and keep that card as the known-good reference', [['Raspberry Pi Imager', 'https://www.raspberrypi.com/software/']]],
      ['p0-3', 'Boot and run <code>face_detection_camera.py</code>, <code>image_classification_camera.py</code> and the button/LED demo', [['Kit guide', 'https://aiyprojects.withgoogle.com/vision-v1/'], ['examples/vision', D + 'src/examples/vision/']]],
      ['p0-4', 'Save <code>dmesg</code>, <code>lsmod</code>, <code>/boot/config.txt</code>, <code>uname -a</code> and <code>dpkg -l | grep aiy</code> to <code>vendor/baseline/</code>', []],
      ['p0-5', 'Copy <code>/lib/firmware/myriad_fw.mvcmd</code> to <code>vendor/firmware/</code>', [['HACKING.md', D + 'HACKING.md']], 'risk'],
      ['p0-6', 'Copy the model files (<code>dpkg -L aiy-models</code>) to <code>vendor/models/</code>', [['Models', 'https://aiyprojects.withgoogle.com/models/']], 'risk'],
      ['p0-7', 'Also save the <code>.deb</code> files from the apt cache, or rebuild them with <code>dpkg-repack</code>', []],
      ['p0-8', 'Add <code>vendor/</code> to <code>.gitignore</code> (the binaries’ license is unclear)', []],
    ]},
  { id: 'p1', title: 'Phase 1 · Inventory',
    items: [
      ['p1-1', 'Read the vision driver: SPI, gpiod, firmware load, <code>/dev/vision_spicomm</code>', [['aiy-vision.c', D + 'drivers/vision/aiy-vision.c']]],
      ['p1-2', 'Read the MCU drivers (mfd, gpio, pwm, adc)', [['drivers/aiy', D + 'drivers/aiy/aiy/']]],
      ['p1-3', 'Read the bonnet overlay (<code>spi0</code>, pins 6/13/26/8, I2C <code>0x51</code>, KTD2026 at <code>0x30</code>)', [['overlay .dts', D + 'drivers/overlays/vision/opt/aiy/overlay-vision/aiy-visionbonnet-overlay.dts']]],
      ['p1-4', 'List every <code>picamera</code> call in <code>src/</code> (10 files)', [['annotator.py', D + 'src/aiy/vision/annotator.py']]],
      ['p1-5', 'List the sysfs paths used by <code>pins.py</code> and <code>_buzzer.py</code>', [['pins.py', D + 'src/aiy/pins.py'], ['_buzzer.py', D + 'src/aiy/_buzzer.py']]],
      ['p1-6', 'Write <code>port/DEPENDENCIES.md</code> with the final list', []],
    ]},
  { id: 'p2', title: 'Phase 2 · Kernel drivers on Bookworm', gate: true,
    intro: 'Go/no-go. If the Myriad doesn’t come up, switch to the fallback.',
    items: [
      ['p2-1', 'Flash Raspberry Pi OS <b>Lite 32-bit</b> Bookworm, then enable SSH and Wi-Fi in Imager', [['OS docs', R + 'rpi-documentation/documentation/asciidoc/computers/os/'], ['Bookworm notes', 'https://www.raspberrypi.com/news/bookworm-the-new-version-of-raspberry-pi-os/']]],
      ['p2-2', '<code>apt install dkms raspberrypi-kernel-headers git</code>, and record <code>uname -r</code>', [['dkms(8)', R + 'dkms-manpage.md'], ['Kernel docs', R + 'rpi-documentation/documentation/asciidoc/computers/linux_kernel/']]],
      ['p2-3', 'Fix <code>aiy-vision.c</code> (K1–K4): one-argument <code>class_create</code>, <code>vm_flags_set()</code>, remove the <code>spi_busnum_to_master</code> check, make <code>remove</code> return <code>void</code>', [['DEPENDENCIES K1–K4', 'port/DEPENDENCIES.md'], ['aiy-vision.c', D + 'drivers/vision/aiy-vision.c']]],
      ['p2-4', 'Fix the I2C drivers <code>aiy-io-i2c</code> and <code>leds-ktd202x</code> (K5–K6): one-argument <code>probe</code>, <code>remove</code> returns <code>void</code>', [['aiy-io-i2c.c', D + 'drivers/aiy/aiy/mfd/aiy-io-i2c.c'], ['leds-ktd202x.c', D + 'drivers/leds/leds-ktd202x.c']]],
      ['p2-5', 'Fix <code>gpio-aiy-io</code> and <code>aiy-adc</code> (K7): platform <code>remove</code> returns <code>void</code>. <code>pwm-aiy-io</code> (K8) can wait: it needs a <code>.apply</code> + <code>devm_pwmchip_alloc</code> rewrite', [['DEPENDENCIES K7–K8', 'port/DEPENDENCIES.md']]],
      ['p2-6', 'Copy <code>myriad_fw.mvcmd</code> to <code>/lib/firmware/</code>', [['request_firmware', R + 'kernel-firmware-api.md']]],
      ['p2-7', 'Add <code>dtoverlay=spi0-1cs,cs0_pin=7</code> to <code>/boot/firmware/config.txt</code>', [['overlays README', R + 'rpi-dt-overlays-README.txt'], ['config.txt docs', R + 'rpi-documentation/documentation/asciidoc/computers/config_txt/']]],
      ['p2-8', 'Check that the HAT EEPROM overlay loads: <code>ls /proc/device-tree/hat</code> and <code>dtoverlay -l</code>', []],
      ['p2-9', 'Build all AIY modules with DKMS and load them', [['SPI summary', R + 'kernel-spi-summary.md'], ['GPIO consumer API', R + 'kernel-gpio-consumer.md']]],
      ['p2-10', 'Pass check: <code>dmesg | grep "Myriad ready"</code> and <code>/dev/vision_spicomm</code> exists', [], 'gate'],
      ['p2-11', 'Pass check: <code>ImageInference</code> on a still JPEG returns faces', [['inference API', R + 'aiy-readthedocs-inference.md']], 'gate'],
    ]},
  { id: 'p3', title: 'Phase 3 · Camera via libcamera / picamera2',
    intro: 'The biggest unknown: does the bonnet’s firmware accept frames when libcamera drives the imx219?',
    items: [
      ['p3-1', 'Read why <code>picamera</code> was dropped', [['Bullseye camera post', 'https://www.raspberrypi.com/news/bullseye-camera-system/']]],
      ['p3-2', '<code>rpicam-hello --list-cameras</code>: check that the imx219 is detected through the bonnet', [['Camera docs', R + 'rpi-documentation/documentation/asciidoc/computers/camera/']]],
      ['p3-3', 'Open picamera2 with a 1640×1232 binned sensor mode at 30 fps', [['Picamera2 manual', 'https://datasheets.raspberrypi.com/camera/picamera2-manual.pdf'], ['picamera2 README', R + 'picamera2/README.md']]],
      ['p3-4', 'While it streams, run <code>CameraInference(face_detection)</code> and check results', [], 'risk'],
      ['p3-5', 'If it fails, compare CSI timing, lanes and mode with the Buster baseline (<code>vcgencmd</code>, <code>dmesg</code>)', []],
      ['p3-6', 'Write <code>aiy/camera.py</code>, a shim that keeps the <code>PiCamera(sensor_mode=4, …)</code> call pattern', [['camera.py', 'port/python/src/aiy/camera.py'], ['patch', 'port/python.patch']]],
      ['p3-7', 'Port the annotator overlay (or drop it on headless setups)', [['annotator.py', D + 'src/aiy/vision/annotator.py']]],
    ]},
  { id: 'p4', title: 'Phase 4 · Python library',
    items: [
      ['p4-1', '<code>sudo apt install python3-picamera2 python3-pil python3-gpiozero python3-lgpio</code>', [['OS docs (pip and venv)', R + 'rpi-documentation/documentation/asciidoc/computers/os/']]],
      ['p4-2', '<code>python3 -m venv --system-site-packages ~/aiy-venv</code>', []],
      ['p4-3', 'Trim <code>setup.py</code> to the vision dependencies (drop Assistant, Cloud Speech and <code>picamera</code>)', [['setup.py', D + 'setup.py']]],
      ['p4-4', 'protobuf (P1): <code>protocol_pb2.py</code> has no <code>.proto</code> source. Rebuild it from the embedded descriptor, or use <code>PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python</code>, or pin 3.20.3', [['protobuf 4 change', R + 'protobuf-python-news.md'], ['proto dir', D + 'src/aiy/vision/proto/']]],
      ['p4-5', 'Switch imports from <code>picamera</code> to the shim, then run every example in <code>src/examples/vision</code>', [['examples', D + 'src/examples/vision/']]],
    ]},
  { id: 'p5', title: 'Phase 5 · GPIO, LEDs, buzzer',
    items: [
      ['p5-1', '<code>gpioinfo</code>: find the <code>gpio-aiy-io</code> chip and its lines', [['libgpiod', R + 'libgpiod-README.md'], ['chardev ABI', R + 'kernel-gpio-chardev.md']]],
      ['p5-2', 'Check whether <code>/sys/class/gpio</code> still works on the Pi kernel. If not, port <code>pins.py</code> to lgpio or libgpiod', [['sysfs (deprecated)', R + 'kernel-gpio-sysfs.md'], ['gpiozero pin factories', R + 'gpiozero-pins.md'], ['gpiod python', R + 'libgpiod-python-README.md']]],
      ['p5-3', 'Try the upstream <code>leds-ktd202x</code> driver before porting Google’s', [['LED class', R + 'kernel-leds-class.md'], ['Google driver', D + 'drivers/leds/leds-ktd202x.c']]],
      ['p5-4', 'Port <code>pwm-soft</code> from legacy <code>gpio_request(int)</code> to gpiod (base 512 issue)', [['pwm-soft.c', D + 'drivers/pwm/pwm-soft.c'], ['PWM API', R + 'kernel-pwm.md']]],
      ['p5-5', 'Test the arcade button, RGB LED, buzzer and privacy LED', [['leds.py', D + 'src/aiy/leds.py'], ['board.py', D + 'src/aiy/board.py']]],
    ]},
  { id: 'p6', title: 'Phase 6 · Make it repeatable',
    items: [
      ['p6-1', 'Write <code>port/install.sh</code>: apt packages, DKMS, firmware, config.txt, venv, systemd units', [['install.sh', 'port/install.sh'], ['port README', 'port/README.md'], ['dkms.conf', 'port/drivers/dkms.conf']]],
      ['p6-2', 'Kernel updates: DKMS rebuilds automatically; <code>--hold-kernel</code> pins the kernel instead (documented in the port README)', [['port README', 'port/README.md']]],
      ['p6-3', 'Fresh-flash test: run <code>port/deploy.sh</code> on a clean card, reboot, and pass <code>hardware_check.py</code> plus face detection', [['deploy.sh', 'port/deploy.sh']], 'gate'],
      ['p6-4', 'Repeat Phases 2–5 on Trixie (kernel 6.12, Python 3.13)', [['Trixie notes', 'https://www.raspberrypi.com/news/trixie-the-new-version-of-raspberry-pi-os/']]],
      ['p6-5', 'Optionally publish the patches as a fork of aiyprojects-raspbian', [['Upstream', 'https://github.com/google/aiyprojects-raspbian']]],
    ]},
  { id: 'fb', title: 'Fallback · if Phase 2 or 3 is blocked',
    items: [
      ['fb-1', 'Bullseye Lite (kernel 6.1): turn on the legacy camera with <code>raspi-config</code> so <code>picamera</code> keeps working', [['configuration docs', R + 'rpi-documentation/documentation/asciidoc/computers/configuration/']]],
      ['fb-2', 'Or stay on Buster: point apt at <code>legacy.raspbian.org</code> and run it firewalled or offline', [['legacy archive', 'https://legacy.raspbian.org/']]],
    ]},
];

const KEY = 'vision-kit-todo-v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
state.done = state.done || {};
state.collapsed = state.collapsed || {};

const root = document.getElementById('phases');
const tagHtml = t => t === 'gate' ? '<span class="tag gate">gate</span>' : t === 'risk' ? '<span class="tag risk">risk</span>' : '';

function render() {
  root.innerHTML = PHASES.map(p => `
    <section id="${p.id}" class="${state.collapsed[p.id] ? 'collapsed' : ''}">
      <header data-phase="${p.id}"><span class="chev">▾</span><h2>${p.title}${p.gate ? '<span class="tag gate">go/no-go</span>' : ''}</h2><span class="count"></span></header>
      <div class="body">
        ${p.intro ? `<p class="intro">${p.intro}</p>` : ''}
        <ul>${p.items.map(([id, text, links, tag]) => `
          <li data-id="${id}" class="${state.done[id] ? 'done' : ''}">
            <input type="checkbox" id="c-${id}" ${state.done[id] ? 'checked' : ''}>
            <label class="t" for="c-${id}"><span>${text}</span>${tagHtml(tag)}
              ${links.length ? `<span class="links">${links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l}</a>`).join('')}</span>` : ''}
            </label>
          </li>`).join('')}
        </ul>
      </div>
    </section>`).join('');
  update();
}

function update() {
  let all = 0, done = 0;
  PHASES.forEach(p => {
    const d = p.items.filter(i => state.done[i[0]]).length;
    all += p.items.length; done += d;
    document.querySelector(`#${p.id} .count`).textContent = `${d} / ${p.items.length}`;
  });
  document.getElementById('total').textContent = `${done} / ${all} done`;
  document.getElementById('meter').style.width = (all ? 100 * done / all : 0) + '%';
}

root.addEventListener('change', e => {
  if (e.target.type !== 'checkbox') return;
  const li = e.target.closest('li');
  state.done[li.dataset.id] = e.target.checked;
  li.classList.toggle('done', e.target.checked);
  save(); update();
});
root.addEventListener('click', e => {
  const h = e.target.closest('header[data-phase]');
  if (!h) return;
  const id = h.dataset.phase;
  state.collapsed[id] = !state.collapsed[id];
  h.parentElement.classList.toggle('collapsed', state.collapsed[id]);
  save();
});

const hideBtn = document.getElementById('hideDone');
function applyHide() { document.body.classList.toggle('hide-done', !!state.hideDone); hideBtn.setAttribute('aria-pressed', !!state.hideDone); }
hideBtn.onclick = () => { state.hideDone = !state.hideDone; applyHide(); save(); };
document.getElementById('expand').onclick = () => { state.collapsed = {}; save(); render(); };
document.getElementById('collapse').onclick = () => { PHASES.forEach(p => state.collapsed[p.id] = true); save(); render(); };
document.getElementById('reset').onclick = e => {
  const b = e.target;
  if (b.dataset.armed) { state.done = {}; save(); render(); b.textContent = 'Reset'; delete b.dataset.armed; return; }
  b.dataset.armed = 1; b.textContent = 'Click again to reset';
  setTimeout(() => { b.textContent = 'Reset'; delete b.dataset.armed; }, 3000);
};
document.getElementById('copy').onclick = e => {
  const strip = s => s.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&rsquo;|’/g, "'");
  const md = PHASES.map(p => `## ${strip(p.title)}\n` + p.items.map(([id, t]) => `- [${state.done[id] ? 'x' : ' '}] ${strip(t)}`).join('\n')).join('\n\n');
  const b = e.target;
  navigator.clipboard.writeText(md).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy as Markdown', 1500); }, () => { b.textContent = 'Copy failed'; });
};

render(); applyHide();
</script>
</body>
</html>
